<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="author" content="Franco Lucena">
    <meta name="description" content="a letter for my gf">
    <title>¿Serias Mi San Valentin?</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="website icon" type="png" href="imagenes/corazon.png">

  </head>
    
  <body>
  <body>
    <div class="container">
      <h1>Feliz San Valentin Amor!</h1>
    </div>
    <div class="letter_ct">
      <input type="checkbox" id="check" />
      <label for="check">
        <span class="letter main"></span>
        <div class="note">
          <p class="int">Mi Amor</p>
          <p>
            Esta vez nos toca un 14 diferente, pero quería volver el tiempo un poco para agradecerte y recordarte lo feliz que me haces. Desde el momento cero que tu humor me atrapó, tu inteligencia y compromiso con las cosas me llamó mucho la atención pero sobretodo tu corazón y empatía fue lo que me terminó de conquistar. Cuando se me vino todo abajo eras la única en ese momento que con una charla me sacaba de ese lugar                                                      
         
            <br/>
            Aunque esto se te quede corto para todo lo que mereces, me darias el honor de ser tu san valentin un año mas?
          </p>
          <p style="text-align: center;">Con amor, Tu novio</p>

          <p class="sign">Te ama,<br />Tu novio</p>
        </div>
        <span class="front"></span>
        <span class="letter flap-bg"></span>
        <span class="letter flap"></span>
        <span class="heart"></span>
      </label>
    </div>
    <div class="txt">
      <h3>Tocá la carta <3</h3>
    </div>
  </body>
    
  </body>
